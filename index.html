<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./Styles/app.css" />
        <link rel="stylesheet" href="./Styles/media.css">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        />
    </head>
    <body onload="getTodosFromLocal()">
        <div class="container">
            <div class="wraper">
                <div class="todo-header">
                    <div class="todo-header-title">
                        <h2>My Todo List</h2>
                    </div>
                    <div class="header-inputs">
                        <div class="searchBox-wraper">
                            <svg
                                class="icon"
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                            >
                                <g>
                                    <path
                                        d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"
                                    ></path>
                                </g>
                            </svg>
                            <input
                                placeholder="Search"
                                type="search"
                                class="search-box"
                            />
                        </div>
                        <div class="sort-card">
                            <button class="sort-button">
                                <span class="sort-type">All </span>
                                <i class="fa fa-angle-down fa-lg"></i>
                            </button>
                            <div class="sort-menu">
                                <button value="All">All</button>
                                <button value="Completed">Completed</button>
                                <button value="Uncompleted">Uncompleted</button>
                            </div>
                            <button class="theme-btn">
                                <i class="fa-solid fa-moon"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <section class="todos-container">
                </section>
            </div>
        </div>
        <div class="modal-screen hidden">
            <div class="modal">
                <header>
                    <button class="cancelX">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                    <span > Add Todo</span>
                </header>
                <main>
                    <div class="input-card">
                        <input type="text" class="input" placeholder="Enter Todo Title ...">
                    </div>

                    <div class="modal-checkbox">
                        <input type="checkbox" name="" id="has-date">
                        <label for="has-date"> Add Date</label>
                    </div>
                </main>
                <footer>
                    <button class="cancel">Cancel</button>
                    <button class="create">Add</button>
                </footer>
            </div>
        </div>
        <button class="Add-btn">
                                <i class="fa-solid fa-add"></i>
                            </button>
        <script src="./Script/app.js"></script>
    </body>
</html>
